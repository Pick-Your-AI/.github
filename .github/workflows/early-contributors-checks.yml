name: Early Contributors checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Verify CLI test prerequisites
        run: |
          gh --version
          jq --version
      - name: Run synthetic workflow and local CLI tests
        run: python -m unittest discover -s tests -v
