name: Governance checks

on:
  pull_request:
    paths:
      - 'governance/**'
      - 'tests/**'
      - '.github/workflows/governance-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python governance/router.py validate-policy --policy governance/escalation-policy.json
      - run: git diff --check
