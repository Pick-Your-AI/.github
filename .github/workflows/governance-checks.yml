name: Governance checks

on:
  pull_request:
    paths:
      - 'governance/**'
      - 'tests/**'
      - 'automation/**'
      - 'proposals/**'
      - 'docs/directory/**'
      - 'docs/organization/**'
      - '.github/workflows/governance-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python governance/router.py validate-policy --policy governance/escalation-policy.json
      - name: Regenerate and validate historical public charts
        run: |
          python -X utf8 docs/organization/snapshots/2026-10-29/build_sources.py
          python -X utf8 docs/organization/snapshots/2026-10-29/validate.py
          git diff --exit-code -- docs/organization/snapshots/2026-10-29
      - name: Check committed patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git show --format= --check HEAD
          fi
