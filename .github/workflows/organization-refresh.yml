name: Organization refresh
# Intentionally manual and owner-gated; no scheduled or push-triggered live collection.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-refresh
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && vars.ORG_DIRECTORY_ACTIVATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: organization-collector
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set isolated run paths
        run: |
          printf '%s\n' "PYA_STATE=$RUNNER_TEMP/organization-private" "PYA_RUN_STATUS=$RUNNER_TEMP/organization-run-status.json" >> "$GITHUB_ENV"
      - name: Start public-safe run receipt from last merged artifacts
        run: python automation/organization_status.py start
      - name: Install renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          test -x /usr/bin/google-chrome
          npm install --global @mermaid-js/mermaid-cli@12.0.0
      - name: Require dedicated read-only collection credential
        env:
          APP_ID: ${{ vars.ORG_DIRECTORY_APP_ID }}
          APP_KEY: ${{ secrets.ORG_DIRECTORY_APP_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$APP_KEY" || {
            echo 'Missing dedicated read-only organization App configuration.'
            exit 1
          }
      - name: Short-lived organization read token
        id: read-token
        env:
          APP_ID: ${{ vars.ORG_DIRECTORY_APP_ID }}
          APP_KEY: ${{ secrets.ORG_DIRECTORY_APP_KEY }}
        run: node automation/collector_token.mjs
      - name: Collect, validate, render and propose approved artifacts
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYA_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: python automation/publish_organization.py
      - name: Record failure separately from last good publication
        if: failure()
        run: |
          echo '## Organization refresh failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The last merged publication remains available. Check its observation timestamp and this run before relying on it.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No private API responses or snapshots are uploaded.' >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke short-lived collector token
        if: always() && steps.read-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        run: gh api --method DELETE installation/token
      - name: Finish public-safe run receipt
        if: always()
        env:
          PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
        run: python automation/organization_status.py finish --outcome "$PUBLICATION_OUTCOME"
      - name: Retain public-safe attempt status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: organization-refresh-status
          path: ${{ runner.temp }}/organization-run-status.json
          if-no-files-found: error
          retention-days: 30
